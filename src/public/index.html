<!DOCTYPE html>
<html>
<head>
    <title>Cat Turret Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            background-color: #222;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
        }
        .main-content {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            grid-template-rows: auto auto;
            gap: 20px;
            align-items: start;
            width: 100%;
            max-width: 1200px;
        }
        .video-container {
            grid-column: 1;
            grid-row: 1;
            position: relative;
            width: 100%;
            max-width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border: 2px solid #444;
        }
        #main-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #pip-feed {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 25%;
            max-width: 200px;
            aspect-ratio: 4/3;
            border: 2px solid #fff;
            z-index: 10;
            background: #000;
        }
        .side-panel {
            grid-column: 2;
            grid-row: 1 / span 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 300px;
        }
        .action-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: background 0.2s;
        }
        #btn-tracking {
            background: #444;
        }
        #btn-tracking.active {
            background: #28a745;
        }
        #btn-armed {
            background: #444;
            position: relative;
            overflow: hidden;
        }
        #btn-armed.armed {
            background: #dc3545;
        }
        #btn-armed::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: rgba(0, 0, 0, 0.3);
            transition: width 0s;
        }
        #btn-armed.charging::before {
            width: 100%;
            transition: width 1s linear;
        }
        #btn-armed span {
            position: relative;
            z-index: 1;
        }
        #btn-armed:active {
            background: #d35400;
        }
        #btn-fire {
            background: #dc3545;
            position: relative;
            overflow: hidden;
        }
        #btn-fire::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: rgba(0, 0, 0, 0.3);
            transition: width 0s;
        }
        #btn-fire.charging::before {
            width: 100%;
            transition: width 1s linear;
        }
        #btn-fire span {
            position: relative;
            z-index: 1;
        }
        #btn-fire:active {
            background: #bd2130;
        }
        .debug-panel, .config-panel {
            width: 100%;
            background: #333;
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #444;
        }
        .debug-panel h2, .config-panel h2 {
            margin-top: 0;
            font-size: 1.2em;
            border-bottom: 1px solid #555;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .stat-item {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .stat-item label {
            color: #aaa;
            width: auto;
        }
        .controls {
            grid-column: 1;
            grid-row: 2;
            padding: 20px;
            background: #333;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .control-group {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        label {
            min-width: 50px;
        }
        input[type=range] {
            flex-grow: 1;
            min-width: 150px;
        }
        input[type=range].pos-indicator {
            opacity: 0.85;
            pointer-events: none;
            height: 12px;
        }
        .pid-grid {
            display: grid;
            grid-template-columns: auto 1fr auto 1fr;
            gap: 10px;
        }
        .pid-grid label {
            min-width: 0;
            padding-right: 5px;
        }
        .pid-grid input {
            width: 100%;
            min-width: 0;
        }
        .pid-header {
            grid-column: 1 / -1;
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 2px;
            color: #aaa;
        }
        
        .turret-arrow {
            position: absolute;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            user-select: none;
            z-index: 20;
            transition: background 0.2s;
        }
        .turret-arrow:active {
            background: rgba(255, 255, 255, 0.3);
        }
        .arrow-up { top: 20px; left: 50%; transform: translateX(-50%); }
        .arrow-down { bottom: 20px; left: 50%; transform: translateX(-50%); }
        .arrow-left { left: 20px; top: 50%; transform: translateY(-50%); }
        .arrow-right { right: 20px; top: 50%; transform: translateY(-50%); }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }
            .main-content {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .side-panel {
                max-width: 100%;
                order: 3;
            }
            .video-container {
                order: 1;
            }
            .controls {
                margin-top: 0;
                order: 2;
            }
            h1 {
                font-size: 1.5em;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <h1>Cat Turret Command Center</h1>
    
    <div class="main-content">
        <div class="video-container">
            <img id="main-feed" src="/video_feed_processed" alt="Processed Feed">
            <img id="pip-feed" src="/video_feed" alt="Raw Feed">
            
            <div class="turret-arrow arrow-up" data-axis="tilt" data-dir="1">▲</div>
            <div class="turret-arrow arrow-down" data-axis="tilt" data-dir="-1">▼</div>
            <div class="turret-arrow arrow-left" data-axis="pan" data-dir="1">◀</div>
            <div class="turret-arrow arrow-right" data-axis="pan" data-dir="-1">▶</div>
        </div>

        <div class="side-panel">
            <div class="action-panel">
                <button id="btn-tracking" class="action-btn">Auto Tracking: OFF</button>
                <button id="btn-detect-toggle" class="action-btn" style="background: #007bff;">Detect: Cat</button>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button onclick="setHome()" class="action-btn" style="background: #6c757d; font-size: 1em; padding: 10px;">Set Home</button>
                    <button onclick="goHome()" class="action-btn" style="background: #6c757d; font-size: 1em; padding: 10px;">Go Home</button>
                </div>
                <button id="btn-armed" class="action-btn"><span>ARM</span></button>                <button id="btn-fire" class="action-btn"><span>FIRE</span></button>
            </div>

            <div class="debug-panel">
                <h2>System Stats</h2>
                <div class="stat-item">
                    <label>CPU:</label>
                    <span><span id="cpu-usage">--</span>%</span>
                </div>
                <div class="stat-item">
                    <label>Temp:</label>
                    <span><span id="cpu-temp">--</span>°C</span>
                </div>
                <div class="stat-item">
                    <label>Memory:</label>
                    <span><span id="mem-usage">--</span>%</span>
                </div>
                <div class="stat-item">
                    <label>Used:</label>
                    <span><span id="mem-used">--</span> MB</span>
                </div>
                <div class="stat-item">
                    <label>Total:</label>
                    <span><span id="mem-total">--</span> MB</span>
                </div>
            </div>
            
            <div class="config-panel">
                <details>
                    <summary style="cursor: pointer; margin-bottom: 5px; outline: none;">
                        <h2 style="display: inline; border: none; margin: 0; padding: 0;">Configuration</h2>
                    </summary>
                    <div style="border-top: 1px solid #555; padding-top: 15px;">
                        <button onclick="testWebhook()" class="action-btn" style="background: #6f42c1; margin-bottom: 15px; padding: 10px; font-size: 1em;">Test Webhook</button>
                        
                        <div class="control-group">
                    <label style="width: auto; margin-right: 10px;">Invert Pan</label>
                    <input type="checkbox" id="invert-pan" style="flex-grow: 0;">
                </div>
                <div class="control-group">
                    <label style="width: auto; margin-right: 10px;">Invert Tilt</label>
                    <input type="checkbox" id="invert-tilt" style="flex-grow: 0;">
                </div>
                
                <div style="margin-top: 10px; border-top: 1px solid #555; padding-top: 10px;">
                    <h3 style="margin: 0 0 10px 0; font-size: 1em;">PID Tuning</h3>
                    <div class="pid-grid">
                        <div class="pid-header">Pan</div>
                        <label>Kp</label>
                        <input type="number" id="kp-pan" step="0.001">
                        <label>Kd</label>
                        <input type="number" id="kd-pan" step="0.001">
                        
                        <div class="pid-header">Tilt</div>
                        <label>Kp</label>
                        <input type="number" id="kp-tilt" step="0.001">
                        <label>Kd</label>
                        <input type="number" id="kd-tilt" step="0.001">
                    </div>
                </div>

                <div style="margin-top: 10px; border-top: 1px solid #555; padding-top: 10px;">
                    <h3 style="margin: 0 0 10px 0; font-size: 1em;">Trigger Settings</h3>
                    <div class="control-group">
                        <label style="width: 100%;">
                            Rest Angle: <span id="trigger-rest-val">--</span>
                        </label>
                        <input type="range" id="trigger-rest" min="0" max="180" step="1">
                    </div>
                    <div class="control-group">
                        <label style="width: 100%;">
                            Fire Angle: <span id="trigger-fire-val">--</span>
                        </label>
                        <input type="range" id="trigger-fire" min="0" max="180" step="1">
                    </div>
                </div>

                <div style="margin-top: 10px; border-top: 1px solid #555; padding-top: 10px;">
                    <h3 style="margin: 0 0 10px 0; font-size: 1em;">Servo Limits</h3>
                    
                    <div id="calibration-controls" style="display: none; background: #444; padding: 10px; border-radius: 4px; margin-bottom: 10px;">
                        <p style="margin: 0 0 10px 0; color: #ffc107;">Calibration Mode Active</p>
                        <p style="margin: 0 0 10px 0; font-size: 0.9em;">Use arrows to move, then set limits.</p>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                            <button onclick="setLimit('pan', 'min')" class="action-btn" style="font-size: 0.9em; padding: 5px; background: #555;">Set Pan Min</button>
                            <button onclick="setLimit('pan', 'max')" class="action-btn" style="font-size: 0.9em; padding: 5px; background: #555;">Set Pan Max</button>
                            <button onclick="setLimit('tilt', 'min')" class="action-btn" style="font-size: 0.9em; padding: 5px; background: #555;">Set Tilt Min</button>
                            <button onclick="setLimit('tilt', 'max')" class="action-btn" style="font-size: 0.9em; padding: 5px; background: #555;">Set Tilt Max</button>
                        </div>
                        <button onclick="stopCalibration()" class="action-btn" style="margin-top: 10px; background: #28a745; font-size: 0.9em; padding: 8px;">Finish Calibration</button>
                    </div>

                    <button id="btn-start-cal" onclick="startCalibration()" style="width: 100%; padding: 8px; background: #ffc107; color: black; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 10px;">Calibrate Range of Motion</button>
                    <button onclick="testRange()" style="width: 100%; padding: 8px; background: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 10px;">Test Range of Motion</button>
                    
                    <div class="control-group">
                        <label style="width: 100%;">
                            Pan Range:
                            <span id="pan-range-val">0 - 240</span>
                            &nbsp;|&nbsp;
                            Min: <span id="pan-min-label">0</span>
                            &nbsp;|&nbsp;
                            Current: <span id="pan-current-label">--</span>
                            &nbsp;|&nbsp;
                            Max: <span id="pan-max-label">240</span>
                        </label>
                        <input type="range" id="pan-min" min="0" max="240" value="0">
                        <input type="range" id="pan-current" class="pos-indicator" min="0" max="240" value="90" disabled>
                        <input type="range" id="pan-max" min="0" max="240" value="240">
                    </div>
                    <div class="control-group">
                        <label style="width: 100%;">
                            Tilt Range:
                            <span id="tilt-range-val">0 - 240</span>
                            &nbsp;|&nbsp;
                            Min: <span id="tilt-min-label">0</span>
                            &nbsp;|&nbsp;
                            Current: <span id="tilt-current-label">--</span>
                            &nbsp;|&nbsp;
                            Max: <span id="tilt-max-label">240</span>
                        </label>
                        <input type="range" id="tilt-min" min="0" max="240" value="0">
                        <input type="range" id="tilt-current" class="pos-indicator" min="0" max="240" value="90" disabled>
                        <input type="range" id="tilt-max" min="0" max="240" value="240">
                    </div>
                </div>

                <button onclick="saveConfig()" style="width: 100%; padding: 8px; background: #555; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;">Save Config</button>
                    </div>
                </details>
            </div>
        </div>

    <div class="controls" style="display: none;">
        <div class="control-group">
            <label style="width: auto; margin-right: 10px;">Auto Tracking</label>
            <input type="checkbox" id="tracking-toggle" style="flex-grow: 0;">
        </div>
    </div>
    </div>

    <script>
        const trackingToggle = document.getElementById('tracking-toggle');
        const btnTracking = document.getElementById('btn-tracking');
        const btnDetectToggle = document.getElementById('btn-detect-toggle');
        const btnArmed = document.getElementById('btn-armed');
        const btnFire = document.getElementById('btn-fire');
        const invertPanCheckbox = document.getElementById('invert-pan');
        const invertTiltCheckbox = document.getElementById('invert-tilt');
        const kpPanInput = document.getElementById('kp-pan');
        const kdPanInput = document.getElementById('kd-pan');
        const kpTiltInput = document.getElementById('kp-tilt');
        const kdTiltInput = document.getElementById('kd-tilt');
        const panMinInput = document.getElementById('pan-min');
        const panMaxInput = document.getElementById('pan-max');
        const tiltMinInput = document.getElementById('tilt-min');
        const tiltMaxInput = document.getElementById('tilt-max');
        const triggerRestInput = document.getElementById('trigger-rest');
        const triggerFireInput = document.getElementById('trigger-fire');
        const panCurrentInput = document.getElementById('pan-current');
        const tiltCurrentInput = document.getElementById('tilt-current');
        const panRangeVal = document.getElementById('pan-range-val');
        const tiltRangeVal = document.getElementById('tilt-range-val');
        const triggerRestVal = document.getElementById('trigger-rest-val');
        const triggerFireVal = document.getElementById('trigger-fire-val');
        const panMinLabel = document.getElementById('pan-min-label');
        const panMaxLabel = document.getElementById('pan-max-label');
        const panCurrentLabel = document.getElementById('pan-current-label');
        const tiltMinLabel = document.getElementById('tilt-min-label');
        const tiltMaxLabel = document.getElementById('tilt-max-label');
        const tiltCurrentLabel = document.getElementById('tilt-current-label');
        const calibrationControls = document.getElementById('calibration-controls');
        const btnStartCal = document.getElementById('btn-start-cal');

        let currentPan = 90;
        let currentTilt = 90;
        let moveInterval = null;
        let currentTarget = 'cat';
        let configLimits = { pan_min: 0, pan_max: 240, tilt_min: 0, tilt_max: 240 };
        let isCalibrating = false;

        function testWebhook() {
            fetch('/test_webhook', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        alert('Webhook test triggered!');
                    } else {
                        alert('Error: ' + data.message);
                    }
                })
                .catch(console.error);
        }

        function updateDetectUI(target) {
            currentTarget = target;
            btnDetectToggle.textContent = `Detect: ${target.charAt(0).toUpperCase() + target.slice(1)}`;
        }

        function startCalibration() {
            fetch('/calibration/start', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        isCalibrating = true;
                        calibrationControls.style.display = 'block';
                        btnStartCal.style.display = 'none';
                        // Unlock limits locally
                        configLimits = { pan_min: 0, pan_max: 240, tilt_min: 0, tilt_max: 240 };
                    }
                });
        }

        function testRange() {
            fetch('/test_range', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    // Optional: show a toast or something
                })
                .catch(console.error);
        }

        function setHome() {
            fetch('/set_home', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        alert('Home position set!');
                        loadConfig(data.config);
                    }
                })
                .catch(console.error);
        }

        function goHome() {
            fetch('/go_home', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    // Optional: show a toast
                })
                .catch(console.error);
        }

        function stopCalibration() {
            fetch('/calibration/stop', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        isCalibrating = false;
                        calibrationControls.style.display = 'none';
                        btnStartCal.style.display = 'block';
                        // Refresh config to get new limits
                        loadConfig(data.config);
                    }
                });
        }

        function setLimit(axis, limit) {
            fetch('/calibration/set_limit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ axis: axis, limit: limit })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    loadConfig(data.config);
                }
            });
        }

        function setDetectionTarget(target) {
            fetch('/set_detection_target', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ target: target }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    updateDetectUI(data.target);
                }
            })
            .catch(console.error);
        }

        btnDetectToggle.addEventListener('click', () => {
            const newTarget = currentTarget === 'cat' ? 'person' : 'cat';
            setDetectionTarget(newTarget);
        });

        function updateRangeLabels() {
            panRangeVal.textContent = `${panMinInput.value} - ${panMaxInput.value}`;
            tiltRangeVal.textContent = `${tiltMinInput.value} - ${tiltMaxInput.value}`;

            panMinLabel.textContent = `${panMinInput.value}`;
            panMaxLabel.textContent = `${panMaxInput.value}`;
            tiltMinLabel.textContent = `${tiltMinInput.value}`;
            tiltMaxLabel.textContent = `${tiltMaxInput.value}`;
            
            triggerRestVal.textContent = triggerRestInput.value;
            triggerFireVal.textContent = triggerFireInput.value;
        }

        function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }

        function updatePositionIndicators() {
            const panVal = clamp(Math.round(currentPan), 0, 240);
            const tiltVal = clamp(Math.round(currentTilt), 0, 240);

            panCurrentInput.value = panVal;
            tiltCurrentInput.value = tiltVal;
            panCurrentLabel.textContent = `${panVal}`;
            tiltCurrentLabel.textContent = `${tiltVal}`;
        }

        [panMinInput, panMaxInput, tiltMinInput, tiltMaxInput, triggerRestInput, triggerFireInput].forEach(input => {
            input.addEventListener('input', updateRangeLabels);
        });

        function loadConfig(config) {
            invertPanCheckbox.checked = config.pan_invert;
            invertTiltCheckbox.checked = config.tilt_invert;
            kpPanInput.value = config.kp_pan;
            kdPanInput.value = config.kd_pan;
            kpTiltInput.value = config.kp_tilt;
            kdTiltInput.value = config.kd_tilt;
            
            panMinInput.value = config.pan_min !== undefined ? config.pan_min : 0;
            panMaxInput.value = config.pan_max !== undefined ? config.pan_max : 240;
            tiltMinInput.value = config.tilt_min !== undefined ? config.tilt_min : 0;
            tiltMaxInput.value = config.tilt_max !== undefined ? config.tilt_max : 240;
            
            triggerRestInput.value = config.trigger_rest_angle !== undefined ? config.trigger_rest_angle : 45;
            triggerFireInput.value = config.trigger_fire_angle !== undefined ? config.trigger_fire_angle : 166;
            
            configLimits.pan_min = parseInt(panMinInput.value);
            configLimits.pan_max = parseInt(panMaxInput.value);
            configLimits.tilt_min = parseInt(tiltMinInput.value);
            configLimits.tilt_max = parseInt(tiltMaxInput.value);
            
            updateRangeLabels();
            updatePositionIndicators();
        }

        // Load initial config
        fetch('/config')
            .then(response => response.json())
            .then(config => {
                loadConfig(config);
            })
            .catch(console.error);

        function saveConfig() {
            const config = {
                pan_invert: invertPanCheckbox.checked,
                tilt_invert: invertTiltCheckbox.checked,
                kp_pan: parseFloat(kpPanInput.value),
                kd_pan: parseFloat(kdPanInput.value),
                kp_tilt: parseFloat(kpTiltInput.value),
                kd_tilt: parseFloat(kdTiltInput.value),
                pan_min: parseInt(panMinInput.value),
                pan_max: parseInt(panMaxInput.value),
                tilt_min: parseInt(tiltMinInput.value),
                tilt_max: parseInt(tiltMaxInput.value),
                trigger_rest_angle: parseFloat(triggerRestInput.value),
                trigger_fire_angle: parseFloat(triggerFireInput.value)
            };
            
            // Update local limits immediately
            configLimits.pan_min = config.pan_min;
            configLimits.pan_max = config.pan_max;
            configLimits.tilt_min = config.tilt_min;
            configLimits.tilt_max = config.tilt_max;

            fetch('/config', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(config),
            })
            .then(response => response.json())
            .then(data => {
                alert('Configuration saved!');
            })
            .catch(console.error);
        }

        // Throttle function to limit API calls
        function throttle(func, limit) {
            let inThrottle;
            let lastArgs;
            let lastContext;
            
            return function executedFunction(...args) {
                if (inThrottle) {
                    lastArgs = args;
                    lastContext = this;
                    return;
                }
                
                func.apply(this, args);
                inThrottle = true;
                
                setTimeout(() => {
                    inThrottle = false;
                    if (lastArgs) {
                        executedFunction.apply(lastContext, lastArgs);
                        lastArgs = null;
                        lastContext = null;
                    }
                }, limit);
            };
        }

        const sendServoUpdate = throttle((pan, tilt) => {
            fetch('/control_servos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ pan, tilt }),
            }).catch(console.error);
        }, 50); // 50ms throttle

        function updateServos() {
            // Disable tracking checkbox visually when moving manually
            updateTrackingUI(false);
            sendServoUpdate(currentPan, currentTilt);
            updatePositionIndicators();
        }

        // Arrow control logic
        function startMove(axis, direction) {
            if (moveInterval) return;
            
            // Disable tracking when manual control starts
            if (trackingToggle.checked) {
                setTracking(false);
            }

            const step = 2; // Degrees per tick
            const tick = () => {
                const isInverted = axis === 'pan' ? invertPanCheckbox.checked : invertTiltCheckbox.checked;
                const effectiveDirection = isInverted ? -direction : direction;
                if (axis === 'pan') {
                    currentPan += effectiveDirection * step;
                    if (isCalibrating) {
                        currentPan = Math.max(0, Math.min(240, currentPan));
                    } else {
                        currentPan = Math.max(configLimits.pan_min, Math.min(configLimits.pan_max, currentPan));
                    }
                } else {
                    currentTilt += effectiveDirection * step;
                    if (isCalibrating) {
                        currentTilt = Math.max(0, Math.min(240, currentTilt));
                    } else {
                        currentTilt = Math.max(configLimits.tilt_min, Math.min(configLimits.tilt_max, currentTilt));
                    }
                }
                updateServos();
            };
            
            tick(); // Immediate first move
            moveInterval = setInterval(tick, 50); // Repeat every 50ms
        }

        function stopMove() {
            if (moveInterval) {
                clearInterval(moveInterval);
                moveInterval = null;
            }
        }

        document.querySelectorAll('.turret-arrow').forEach(arrow => {
            const axis = arrow.dataset.axis;
            const dir = parseInt(arrow.dataset.dir);

            const startHandler = (e) => {
                e.preventDefault(); // Prevent text selection/scrolling
                startMove(axis, dir);
            };

            const stopHandler = (e) => {
                e.preventDefault();
                stopMove();
            };

            arrow.addEventListener('mousedown', startHandler);
            arrow.addEventListener('touchstart', startHandler);
            
            arrow.addEventListener('mouseup', stopHandler);
            arrow.addEventListener('mouseleave', stopHandler);
            arrow.addEventListener('touchend', stopHandler);
            arrow.addEventListener('touchcancel', stopHandler);
        });

        function updateTrackingUI(enabled) {
            trackingToggle.checked = enabled;
            if (enabled) {
                btnTracking.textContent = "Auto Tracking: ON";
                btnTracking.classList.add('active');
            } else {
                btnTracking.textContent = "Auto Tracking: OFF";
                btnTracking.classList.remove('active');
            }
        }

        function updateArmedUI(enabled) {
            if (enabled) {
                btnArmed.classList.add('armed');
                btnArmed.querySelector('span').textContent = "ARMED";
            } else {
                btnArmed.classList.remove('armed');
                btnArmed.querySelector('span').textContent = "ARM";
            }
        }

        function setTracking(enabled) {
            fetch('/set_tracking', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ enabled: enabled }),
            })
            .then(response => response.json())
            .then(data => {
                updateTrackingUI(data.enabled);
            })
            .catch(console.error);
        }

        function setArmed(enabled) {
            fetch('/set_armed', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ enabled: enabled }),
            })
            .then(response => response.json())
            .then(data => {
                updateArmedUI(data.enabled);
            })
            .catch(console.error);
        }

        btnTracking.addEventListener('click', () => {
            setTracking(!trackingToggle.checked);
        });

        let armedTimeout;

        const startArmedSequence = (e) => {
            e.preventDefault();
            if (armedTimeout) return;
            
            // If already armed, disarm immediately on click (or hold? let's say hold to arm, click to disarm?)
            // The previous logic was hold to toggle. Let's keep hold to toggle for safety.
            
            btnArmed.classList.add('charging');
            
            armedTimeout = setTimeout(() => {
                // Toggle armed state
                const isArmed = btnArmed.classList.contains('armed');
                setArmed(!isArmed);
                
                // Reset UI
                btnArmed.classList.remove('charging');
                armedTimeout = null;
            }, 1000);
        };

        const cancelArmedSequence = (e) => {
            e.preventDefault();
            if (armedTimeout) {
                clearTimeout(armedTimeout);
                armedTimeout = null;
                btnArmed.classList.remove('charging');
            }
        };

        btnArmed.addEventListener('mousedown', startArmedSequence);
        btnArmed.addEventListener('touchstart', startArmedSequence);
        
        btnArmed.addEventListener('mouseup', cancelArmedSequence);
        btnArmed.addEventListener('mouseleave', cancelArmedSequence);
        btnArmed.addEventListener('touchend', cancelArmedSequence);
        btnArmed.addEventListener('touchcancel', cancelArmedSequence);

        let fireTimeout;
        
        const startFireSequence = (e) => {
            e.preventDefault();
            if (fireTimeout) return;
            
            btnFire.classList.add('charging');
            
            fireTimeout = setTimeout(() => {
                // Fire!
                fetch('/fire', { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status !== 'ok') {
                            alert('Error firing: ' + data.message);
                        }
                    })
                    .catch(console.error);
                
                // Reset UI
                btnFire.classList.remove('charging');
                fireTimeout = null;
            }, 1000);
        };

        const cancelFireSequence = (e) => {
            e.preventDefault();
            if (fireTimeout) {
                clearTimeout(fireTimeout);
                fireTimeout = null;
                btnFire.classList.remove('charging');
            }
        };

        btnFire.addEventListener('mousedown', startFireSequence);
        btnFire.addEventListener('touchstart', startFireSequence);
        
        btnFire.addEventListener('mouseup', cancelFireSequence);
        btnFire.addEventListener('mouseleave', cancelFireSequence);
        btnFire.addEventListener('touchend', cancelFireSequence);
        btnFire.addEventListener('touchcancel', cancelFireSequence);

        trackingToggle.addEventListener('change', (e) => {
            setTracking(e.target.checked);
        });

        function updateStats() {
            fetch('/system_stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('cpu-usage').textContent = data.cpu_percent.toFixed(1);
                    if (data.cpu_temp !== null) {
                        document.getElementById('cpu-temp').textContent = data.cpu_temp.toFixed(1);
                    } else {
                        document.getElementById('cpu-temp').textContent = "--";
                    }
                    document.getElementById('mem-usage').textContent = data.memory_percent.toFixed(1);
                    document.getElementById('mem-used').textContent = (data.memory_used / 1024 / 1024).toFixed(0);
                    document.getElementById('mem-total').textContent = (data.memory_total / 1024 / 1024).toFixed(0);
                    
                    // Sync state
                    updateTrackingUI(data.tracking_enabled);
                    updateArmedUI(data.armed);
                    
                    // Sync positions if not manually moving
                    if (!moveInterval) {
                        currentPan = data.current_pan;
                        currentTilt = data.current_tilt;
                    }

                    updatePositionIndicators();
                })
                .catch(console.error);
        }

        // Update stats every 2 seconds
        setInterval(updateStats, 2000);
        updateStats();
    </script>
</body>
</html>
